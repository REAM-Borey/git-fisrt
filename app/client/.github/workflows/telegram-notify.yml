name: Telegram Notification

on:
  push:
    branches: ["main"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.8403928815:AAEsKVB5vO1OquoACKtugWhoud8aMO20GFI }}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\": \"${{ secrets.1758968042 }}\", \"text\": \"🚀 New push to repo '${{ github.repository }}' by ${{ github.actor }} on branch ${{ github.ref }}\"}"
